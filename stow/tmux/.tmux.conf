# macOS-first tmux — Ctrl-a prefix with ergonomic chords

# --- Terminal / colors ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,screen-256color:RGB"

set -g default-shell "/bin/zsh"
set -g history-limit 100000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g repeat-time 300
set -g focus-events on
set -g set-clipboard on

# --- Prefix: Ctrl-a (double-tap to send literal Ctrl-a to shell) ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- Gruvbox status (match Starship gruvbox_dark) ---
set -g @tmux-gruvbox "dark256"
set -g @tmux-gruvbox-right-status-x "%Y-%m-%d"
set -g @tmux-gruvbox-right-status-y "%H:%M"

# --- TPM plugins ---
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "egel/tmux-gruvbox"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "tmux-plugins/tmux-yank"

# --- Prefix bindings: works whether you release Ctrl or hold it ---
# Splits keep current working directory.
bind \\   split-window -h -c "#{pane_current_path}"
bind C-\\ split-window -h -c "#{pane_current_path}"
bind v    split-window -h -c "#{pane_current_path}"
bind -    split-window -v -c "#{pane_current_path}"
bind C-_  split-window -v -c "#{pane_current_path}"
bind s    split-window -v -c "#{pane_current_path}"

bind c    new-window -c "#{pane_current_path}"
bind C-c  new-window -c "#{pane_current_path}"

bind x    confirm-before -p "kill pane #P? (y/n)" kill-pane
bind C-x  confirm-before -p "kill pane #P? (y/n)" kill-pane

bind z    resize-pane -Z
bind d    detach
bind C-d  detach
bind r    source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind w    choose-window

bind -r n   next-window
bind -r p   previous-window
bind -r C-n next-window
bind -r C-p previous-window

bind   h   select-pane -L
bind   j   select-pane -D
bind   k   select-pane -U
bind   l   select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- No-prefix navigation ---
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind -n S-Left  previous-window
bind -n S-Right next-window

# --- Copy mode (vi) ---
setw -g mode-keys vi
set -g status-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

run "~/.tmux/plugins/tpm/tpm"

# --- After plugins: keep zsh emacs bindings (C-h backspace, C-l clear, etc.) ---
# vim-tmux-navigator's tmux side rebinds C-h/j/k/l to navigate panes, which
# clobbers zsh's emacs keys. Forward them to the running program; Neovim's
# vim-tmux-navigator (lua side) still handles pane jumps from inside nvim.
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
bind -n C-h send-keys C-h
bind -n C-j send-keys C-j
bind -n C-k send-keys C-k
bind -n C-l send-keys C-l
