# macOS-first tmux defaults
set -g default-shell "/bin/zsh"
set -g history-limit 100000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on

# Use vi keys in copy mode and movement prompts.
setw -g mode-keys vi
set -g status-keys vi

# Keep colors sane in modern terminals.
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ",screen-256color:RGB"

# Prefix and ergonomics.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Pane splitting keeps current path.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload quickly while iterating on config.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Status line: compact and readable.
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 80
set -g status-left "#[bold] #S "
set -g status-right "#[fg=green]%H:%M #[fg=colour244]%Y-%m-%d #[default]"
set -g window-status-current-format "#[bold]#I:#W"
